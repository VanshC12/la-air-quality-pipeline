name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  AIRFLOW_VERSION: "3.3.2"

jobs:
  lint-and-unit:
    name: lint + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest tests/unit --cov=la_aq --cov-report=term-missing

  integration:
    name: loader + quality gate + dbt build (Postgres)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      WAREHOUSE_DSN: postgresql://warehouse:warehouse@localhost:5432/warehouse
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
      WAREHOUSE_DB: warehouse
      RAW_DATA_DIR: ${{ github.workspace }}/data/raw
      DBT_TARGET: dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"

      - name: Integration tests (loader, idempotency, quality gate)
        run: pytest tests/integration -m integration

      - name: Land + load 7 synthetic days (deterministic, no network)
        run: python -m la_aq run --synthetic --start 2026-10-13 --end 2026-10-19

      - name: dbt build (seed + run + schema/singular/unit tests)
        working-directory: dbt
        run: |
          dbt --no-use-colors debug --profiles-dir .
          dbt --no-use-colors build --profiles-dir .

      - name: Incremental re-run is a no-op on unchanged data
        working-directory: dbt
        run: dbt --no-use-colors run --profiles-dir . --select staging

      - name: Re-load one day and prove the incremental models pick it up
        run: |
          python -m la_aq run --synthetic --start 2026-10-19 --end 2026-10-19
          cd dbt && dbt --no-use-colors build --profiles-dir .

      - name: Upload dbt artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dbt-target
          path: dbt/target
          retention-days: 7

  dag-integrity:
    name: DAG integrity (Airflow 3.3.2)
    runs-on: ubuntu-latest
    needs: lint-and-unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install Airflow with the official constraints
        run: |
          pip install "apache-airflow==${AIRFLOW_VERSION}" apache-airflow-providers-standard pytest pendulum \
            --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-${AIRFLOW_VERSION}/constraints-${PYTHON_VERSION}.txt"
          pip install -e .
      - run: pytest tests/dags -m dag
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow
