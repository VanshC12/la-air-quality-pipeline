[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "la-aq"
version = "0.1.0"
description = "ELT pipeline: Open-Meteo air quality + weather for Los Angeles into a Postgres warehouse (Airflow + dbt)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "requests>=2.31",
    "tenacity>=8.2",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "dbt-postgres>=1.9,<2.0",
]
dashboard = [
    "streamlit>=1.35",
    "pandas>=2.2",
    "plotly>=5.20",
]

[project.scripts]
la-aq = "la_aq.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "dags", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = [
    "integration: needs a reachable Postgres (WAREHOUSE_DSN)",
    "dag: needs apache-airflow installed",
]
